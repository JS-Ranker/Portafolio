  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo. Por defecto: oscuro (tema de la marca). -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { /* sin almacenamiento */ }
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
    })();
  </script>
